name: Backend CI

on:
  push:
    branches: [main, dev, test/*]
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/backend-ci.yml'

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bastet
          POSTGRES_PASSWORD: bastet
          POSTGRES_DB: bastet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bastet -d bastet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg2://bastet:bastet@localhost:5432/bastet
      TEST_DATABASE_URL: postgresql+psycopg2://bastet:bastet@localhost:5432/bastet_test
      GEOAPI_KEY: ${{ secrets.GEOAPI_KEY }}
      ADMIN_AUTH_SECRET: ${{ secrets.ADMIN_AUTH_SECRET }}
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      ADOPTANT_SECRET: ${{ secrets.ADOPTANT_SECRET }}
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      MAIL_PORT: ${{ secrets.MAIL_PORT }}
      MAIL_SERVER: ${{ secrets.MAIL_SERVER }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Create test database
        run: psql "postgresql://bastet:bastet@localhost:5432/bastet" -c "CREATE DATABASE bastet_test;"

      - name: Apply migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Check models match migrations
        working-directory: backend
        run: alembic check

      - name: Run pytest
        working-directory: backend
        run: pytest tests/ -v --tb=short

  docker:
    name: Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t bastet-backend:ci backend
